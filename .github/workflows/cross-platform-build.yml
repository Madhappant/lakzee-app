name: Build Cross-Platform Apps

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Debug Node Version
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        working-directory: ./web
        run: npm install

      - name: Build Next.js & Sync Capacitor
        working-directory: ./web
        run: |
          node -v
          npm run mobile:build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Grant execute permission for gradlew
        working-directory: ./web/android
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: ./web/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

  ios-build:
    name: Build iOS (Dry Run)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Dependencies
        working-directory: ./web
        run: npm install

      - name: Build Next.js & Sync Capacitor
        working-directory: ./web
        run: npm run mobile:build

      - name: Build iOS Xcode Project
        working-directory: ./web/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator build

  windows-build:
    name: Build Windows PC App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install Dependencies
        working-directory: ./web
        run: npm install

      - name: Build Next.js Frontend
        working-directory: ./web
        run: npm run build

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./web
          tauriScript: npx tauri
          args: --target x86_64-pc-windows-msvc
